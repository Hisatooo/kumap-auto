name: 承認された投稿を Instagram に出す
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency: kumap-publish

jobs:
  publish:
    if: github.event.label.name == 'approve' && contains(github.event.issue.body, '<!-- kumap-post:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/publish.js
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: 完了したら Issue を閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Instagram に投稿しました ✅"
      - name: 失敗したら知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "投稿に失敗しました。ログ: $RUN_URL （直したら approve ラベルを外して付け直すと再実行されます）"
